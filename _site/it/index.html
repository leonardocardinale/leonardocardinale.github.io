<script>
(function () {
  const AUTHOR_ID = 2860811;
  const citeEl = document.querySelector(".latest-cite"); // only fill this span
  if (!citeEl) return;

  // One-time cleanup: old cache that contained the label
  try {
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith(`inspire_latest_${AUTHOR_ID}_hep_cite_v1`)) {
        localStorage.removeItem(k);
      }
    });
  } catch {}

  // New cache key: citation-only (no label inside)
  const CACHE_KEY = `inspire_latest_${AUTHOR_ID}_citeonly_v2`;

  // Try cache (6h)
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const { ts, html } = JSON.parse(cached);
      if (Date.now() - ts < 6 * 60 * 60 * 1000) {
        // extra safety: strip any leading <strong>…</strong> if present
        citeEl.innerHTML = (html || "").replace(/^\s*<strong>.*?<\/strong>\s*/i, "");
        return;
      }
    }
  } catch {}

  const jget = (url) =>
    fetch(url, { headers: { Accept: "application/json" } })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });

  // Your original queries
  const qById =
    "https://inspirehep.net/api/literature" +
    "?sort=mostrecent&size=1" +
    "&q=" + encodeURIComponent(`authors.control_number:${AUTHOR_ID}`) +
    "&fields=titles,authors.full_name,publication_info,earliest_date,dois,arxiv_eprints,primary_arxiv_category";
  const authorURL = `https://inspirehep.net/api/authors/${AUTHOR_ID}?fields=ids,name`;

  function buildCitation(hit) {
    const md = hit.metadata || {};
    const id = hit.id;
    const recordUrl = `https://inspirehep.net/literature/${id}`;

    const authors = (md.authors || []).map(a => a.full_name).filter(Boolean);
    const authorsText = authors.join("; ");
    const title = md.titles?.[0]?.title || "Untitled";

    const pubs = Array.isArray(md.publication_info) ? md.publication_info : [];
    const j = pubs.find(p => p.journal_title) || pubs[0] || {};
    const journal = j.journal_title || "";
    const volume  = j.journal_volume || "";
    const year    = j.year || (md.earliest_date || "").slice(0,4) || "";
    const pages   =
      (j.page_start && j.page_end && `${j.page_start}-${j.page_end}`) ||
      j.page_start || j.artid || "";

    let journalBlock = "";
    if (journal) {
      journalBlock = [journal, volume].filter(Boolean).join(" ");
      if (year) journalBlock += ` (${year})`;
      if (pages) journalBlock += ` ${pages}`;
    } else if (year) {
      journalBlock = `(${year})`;
    }

    const doi = md.dois?.[0]?.value || "";
    const arx = md.arxiv_eprints?.[0]?.value || md.arxiv_eprints?.[0]?.eprint || "";
    const cat = md.primary_arxiv_category?.term || md.arxiv_eprints?.[0]?.categories?.[0] || "";

    const parts = [];
    if (journalBlock) parts.push(journalBlock);
    if (doi) parts.push(`doi:${doi}`);
    if (arx) parts.push(`arXiv:${arx}${cat ? ` [${cat}]` : ""}`);

    // ⟵ IMPORTANT: no label here; citation only
    return (
      `${authorsText}, ` +
      `&ldquo;<a href="${recordUrl}" target="_blank" rel="noopener">${title}</a>&rdquo;` +
      (parts.length ? `, <span>${parts.join(", ")}</span>` : "")
    );
  }

  function renderFromData(data) {
    const hit = data?.hits?.hits?.[0];
    if (!hit) throw new Error("No results");
    const html = buildCitation(hit);
    citeEl.innerHTML = html;                         // fill only the span
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), html })); } catch {}
  }

  // Try control_number first; then BAI/exact name
  jget(qById)
    .then(d => {
      if (d?.hits?.hits?.length) { renderFromData(d); return null; }
      return jget(authorURL);
    })
    .then(authorData => {
      if (!authorData) return null;
      const amd = authorData.metadata || {};
      const ids = Array.isArray(amd.ids) ? amd.ids : [];
      const bai =
        ids.find(x => (x.schema || x.source || "").toUpperCase() === "BAI")?.value ||
        ids.map(x => x.value).find(v => typeof v === "string" && /\.\d+$/.test(v));
      const exactName = amd.name?.value || "";

      const queries = [];
      if (bai) queries.push(`a ${bai}`);
      if (exactName) queries.push(`ea ${exactName}`);

      const tryNext = () => {
        const q = queries.shift();
        if (!q) throw new Error("No results for any query");
        const url =
          "https://inspirehep.net/api/literature" +
          "?sort=mostrecent&size=1" +
          "&q=" + encodeURIComponent(q) +
          "&fields=titles,authors.full_name,publication_info,earliest_date,dois,arxiv_eprints,primary_arxiv_category";
        return jget(url).then(d => {
          if (d?.hits?.hits?.length) { renderFromData(d); return null; }
          return tryNext();
        });
      };
      return tryNext();
    })
    .catch(() => {
      const authorUrl = `https://inspirehep.net/authors/${AUTHOR_ID}`;
      citeEl.innerHTML = `<a href="${authorUrl}" target="_blank" rel="noopener">See my publications on INSPIRE</a>`;
    });
})();
</script>

<script>
document.addEventListener("click", function (e) {
  const a = e.target.closest('a');
  if (!a) return;

  const href = a.getAttribute("href") || "";
  const hashMatch = href.match(/^#lang-(en|fr|el|it)$/);

  let imgLang = null;
  const img = a.querySelector('img[src*="flags/"]');
  if (img) {
    const src = img.getAttribute("src") || "";
    const m = src.match(/(?:\.\/|\/)flags\/([a-zA-Z-]+)\.svg$/);
    if (m) {
      const code = m[1].toLowerCase();
      if (["en", "us", "gb"].includes(code)) imgLang = "en";
      else if (code === "fr") imgLang = "fr";
      else if (["gr", "el"].includes(code)) imgLang = "el";
      else if (code === "it") imgLang = "it";
    }
  }

  const targetLang = hashMatch ? hashMatch[1] : imgLang;
  if (!targetLang) return;

  e.preventDefault();

  const prefixes = { en: "", fr: "/fr", el: "/el", it: "/it" };

  function normalize(path) {
    let p = path.startsWith("/") ? path : "/" + path;
    if (p.endsWith("/")) p += "index.html";
    return p;
  }
  function stripLangPrefix(path) {
    const m = path.match(/^\/(fr|el|it)(\/.*)?$/);
    return normalize(m ? (m[2] || "/") : path);
  }

  const current = window.location.pathname;
  const rest = stripLangPrefix(current);
  const targetUrl = (targetLang === "en") ? rest : prefixes[targetLang] + rest;

  window.location.href = targetUrl;
});
</script>

              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
